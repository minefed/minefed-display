plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'MCEF'
		url = uri('https://mcef-download.cinemamod.com/repositories/releases')
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"minefed-display" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// MCEF
	modCompileOnly 'com.cinemamod:mcef:2.1.6-1.20.4'
	modRuntimeOnly 'com.cinemamod:mcef-fabric:2.1.6-1.20.4'
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

// An opt-in graphics regression check; requires a desktop OpenGL driver, but
// creates only a hidden window and does not launch Minecraft or MCEF.
sourceSets {
	renderTest {
		compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
		runtimeClasspath += sourceSets.client.runtimeClasspath
	}
	// Lightweight MCEF boundary fixtures; deliberately excluded from the mod JAR.
	browserTest
}

dependencies {
	browserTestImplementation 'org.ow2.asm:asm:9.7.1'
	browserTestCompileOnly sourceSets.client.output
}

tasks.register('verifyDisplayCursor', JavaExec) {
	group = 'verification'
	description = 'Checks that passive browsers cannot change the game cursor, including during creation.'
	dependsOn tasks.named('clientClasses'), tasks.named('browserTestClasses')
	// Fixtures replace MCEF only in this process; execute the compiled production factory.
	classpath = sourceSets.browserTest.runtimeClasspath + sourceSets.client.output
	mainClass = 'team.minefed.mods.display.client.renderers.DisplayCursorTest'
	doFirst {
		systemProperty 'minefed.mcefClasspath', sourceSets.client.compileClasspath.asPath
	}
}

tasks.register('verifyDisplayOcclusion', JavaExec) {
	group = 'verification'
	description = 'Checks display depth occlusion in a hidden OpenGL context.'
	classpath = sourceSets.renderTest.runtimeClasspath
	mainClass = 'team.minefed.mods.display.client.renderers.DisplayOcclusionTestLauncher'
	systemProperty 'fabric.development', 'true'
	workingDir = layout.buildDirectory.dir('render-test').get().asFile
	doFirst {
		workingDir.mkdirs()
		def classpathFile = new File(workingDir, 'classpath.txt')
		classpathFile.setText(classpath.asPath, 'UTF-8')
		systemProperty 'minefed.testClasspath', classpathFile.absolutePath
	}
}

// Runs the public production renderer against the preserved pre-optimization
// command stream. No OpenGL context, game instance, or browser is needed.
tasks.register('verifyDisplayBezelTrace', JavaExec) {
	group = 'verification'
	description = 'Compares complete ordered bezel layer, vertex, and UV traces.'
	maxHeapSize = '512m'
	classpath = sourceSets.renderTest.runtimeClasspath
	mainClass = 'team.minefed.mods.display.client.renderers.DisplayOcclusionTestLauncher'
	systemProperty 'fabric.development', 'true'
	systemProperty 'minefed.testMainClass', 'team.minefed.mods.display.client.renderers.DisplayBezelTraceTest'
	workingDir = layout.buildDirectory.dir('bezel-trace-test').get().asFile
	doFirst {
		workingDir.mkdirs()
		def classpathFile = new File(workingDir, 'classpath.txt')
		classpathFile.setText(classpath.asPath, 'UTF-8')
		systemProperty 'minefed.testClasspath', classpathFile.absolutePath
	}
}

tasks.named('check') {
	dependsOn tasks.named('verifyDisplayBezelTrace')
	dependsOn tasks.named('verifyDisplayCursor')
}
